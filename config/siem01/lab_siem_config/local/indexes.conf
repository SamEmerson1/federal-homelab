# Retention 90 days; size caps keep total index storage under 25 GB on a 49 GB root volume.
[lab_win]
homePath   = $SPLUNK_DB/lab_win/db
coldPath   = $SPLUNK_DB/lab_win/colddb
thawedPath = $SPLUNK_DB/lab_win/thaweddb
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 7776000

[lab_sysmon]
homePath   = $SPLUNK_DB/lab_sysmon/db
coldPath   = $SPLUNK_DB/lab_sysmon/colddb
thawedPath = $SPLUNK_DB/lab_sysmon/thaweddb
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 7776000

[lab_linux]
homePath   = $SPLUNK_DB/lab_linux/db
coldPath   = $SPLUNK_DB/lab_linux/colddb
thawedPath = $SPLUNK_DB/lab_linux/thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 7776000
